services:
  postgres:
    # assumes `amd64` architecture
    # if on `arm64` (aka Apple M processors)
    # add `POSTGIS_IMAGE=imresamu/postgis:18-3.6.1-bookworm` to `.env` file
    image: ${POSTGIS_IMAGE:-postgis/postgis:18-3.6}
    shm_size: 128mb
    environment:
      POSTGRES_DB: django
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD", "pg_isready", "--username", "postgres"]
      start_period: 30s
      start_interval: 2s
    ports:
      - 5432:5432
    volumes:
      - postgres:/var/lib/postgresql

  rabbitmq:
    image: rabbitmq:4.3.6-management-alpine
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      start_period: 30s
      start_interval: 2s
    ports:
      - 5672:5672
      - 15672:15672
    volumes:
      - rabbitmq:/var/lib/rabbitmq

  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    environment:
      AWS_ACCESS_KEY_ID: seaweedAccessKey
      AWS_SECRET_ACCESS_KEY: seaweedSecretKey
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8333/healthz"]
      start_period: 30s
      start_interval: 2s
    ports:
      - 8333:8333
      - 23646:23646
    volumes:
      - seaweedfs:/data

  redis:
    image: redis:alpine
    command: ["redis-server", "--maxmemory", "25MB", "--maxmemory-policy", "volatile-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      start_period: 30s
      start_interval: 2s
    ports:
      - 6379:6379
    volumes:
      - redis:/data

volumes:
  postgres:
  rabbitmq:
  seaweedfs:
  redis:
