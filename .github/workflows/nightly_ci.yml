name: nightly-ci
on:
  workflow_dispatch:
  schedule:
    # Run at 1:14 am every night, to avoid high load at common schedule times.
    - cron: "14 1 * * *"
permissions:
  contents: read
jobs:
  test-server-slow:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_DB: django
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready --username postgres"
          --health-start-period 30s
          --health-start-interval 2s
        ports:
          - 5432:5432
      rabbitmq:
        image: rabbitmq:4.3-management-alpine
        options: >-
          --health-cmd "rabbitmq-diagnostics ping"
          --health-start-period 30s
          --health-start-interval 2s
        ports:
          - 5672:5672
      seaweedfs:
        image: chrislusf/seaweedfs:4.48
        env:
          AWS_ACCESS_KEY_ID: seaweedAccessKey
          AWS_SECRET_ACCESS_KEY: seaweedSecretKey
        options: >-
          --health-cmd "curl --fail --silent http://localhost:8333/healthz"
          --health-start-period 30s
          --health-start-interval 2s
        ports:
          - 8333:8333
      redis:
        image: redis:alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-start-period 30s
          --health-start-interval 2s
        ports:
          - 6379:6379
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Run tests
        run: |
          uv run --locked tox -e test -- -m slow
        env:
          DJANGO_DATABASE_URL: postgres://postgres:postgres@localhost:5432/django
          DJANGO_CELERY_BROKER_URL: amqp://localhost:5672/
          DJANGO_MINIO_STORAGE_URL: http://seaweedAccessKey:seaweedSecretKey@localhost:8333/django-storage
          DJANGO_REDIS_URL: redis://localhost:6379
          DJANGO_UVDAT_WEB_URL: http://localhost:8080/
